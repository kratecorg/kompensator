# prod environment: runs the "web" stack, but pins its projects to node subsets.
name: prod
stacks:
  - name: web
    projects:
      # The app tier runs on the two application nodes.
      - name: frontend
        nodes: [node-a, node-b]
      # The cache is pinned to the db node only.
      - name: cache
        nodes: [node-db]

# Environment-wide variables (win over the stack defaults).
variables:
  WEB_PORT: "8080"
