# frontend project (runs on node-a and node-b — see prod/env.yml placement).
# kompensator injects FRONTEND_IMAGE / FRONTEND_TAG, plus NODE_NAME and ENV_NAME.
services:
  frontend:
    image: ${FRONTEND_IMAGE}:${FRONTEND_TAG}
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
